name: CI - Application Build

on:
  workflow_dispatch:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]
    paths:
      - "apps/**"
      - "packages/db/**"
      - "packages/types/**"
      - "packages/upload/**"
      - "packages/file-parsers/**"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/ci-application.yml"

concurrency:
  group: application-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and smoke-test applications
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: circulo
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user -d circulo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      NODE_ENV: test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3002
      DATABASE_URL: postgres://user:password@localhost:5432/circulo
      BETTER_AUTH_URL: http://localhost:3002
      BETTER_AUTH_SECRET: test-secret-with-at-least-32-characters
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      INTERNAL_API_SECRET: test-internal-api-secret-with-32-chars

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scan dependency lockfile
        uses: google/osv-scanner-action/osv-scanner-action@baa4139e56d6312335d899e6ba045fa16d1d3d0b # v2.5.1
        with:
          scan-args: |-
            --lockfile=bun.lock

      - name: Check database migration graph
        run: bun run db:check

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Run repository lint
        run: bun run lint:check

      - name: Build production application graph
        run: bun run build

      - name: Type check repository
        run: bun run typecheck

      - name: Run repository tests
        run: bun run test
