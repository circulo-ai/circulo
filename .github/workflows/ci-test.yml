name: CI - Test

on:
  pull_request:
    branches: [master, dev, backend]
  push:
    branches: [master, backend]
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci/test.yml'

jobs:
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.changed.outputs.packages }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get changed packages
        id: changed
        run: |
          # Get list of changed packages
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^packages/' | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n")[:-1]')
          echo "packages=$CHANGED" >> $GITHUB_OUTPUT

  test:
    name: Test Changed Packages
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Check if package has tests
        id: check-tests
        run: |
          if [ -f "packages/${{ matrix.package }}/package.json" ]; then
            HAS_TEST=$(cat packages/${{ matrix.package }}/package.json | jq -r '.scripts.test // empty')
            if [ -n "$HAS_TEST" ]; then
              echo "has_test=true" >> $GITHUB_OUTPUT
            else
              echo "has_test=false" >> $GITHUB_OUTPUT
            fi
          fi
      
      - name: Run tests
        if: steps.check-tests.outputs.has_test == 'true'
        run: |
          cd packages/${{ matrix.package }}
          pnpm test