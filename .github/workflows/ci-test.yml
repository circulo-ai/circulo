name: CI - Test

on:
  workflow_dispatch:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]
    paths:
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/ci-test.yml"

jobs:
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.changed.outputs.packages }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed packages
        id: changed
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            PREV_SHA=${{ github.event.before }}
            if [ -z "$PREV_SHA" ] || [ "$PREV_SHA" = "0000000000000000000000000000000000000000" ]; then
              PREV_SHA=$(git rev-parse HEAD^)
            fi
            RANGE="$PREV_SHA...HEAD"
          fi

          CHANGED=$(git diff --name-only "$RANGE" -- "packages/*" | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n")[:-1]')
          echo "packages=$CHANGED" >>"$GITHUB_OUTPUT"

  test:
    name: Test Changed Packages
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'

    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          set -euo pipefail
          if bun install --frozen-lockfile; then
            exit 0
          fi
          echo "bun.lock invalid; reinstalling without the lockfile" >&2
          rm -f bun.lock
          bun install

      - name: Check if package has tests
        id: check-tests
        run: |
          if [ -f "packages/${{ matrix.package }}/package.json" ]; then
            HAS_TEST=$(cat packages/${{ matrix.package }}/package.json | jq -r '.scripts.test // empty')
            if [ -n "$HAS_TEST" ]; then
              echo "has_test=true" >> $GITHUB_OUTPUT
            else
              echo "has_test=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run tests
        if: steps.check-tests.outputs.has_test == 'true'
        run: |
          cd packages/${{ matrix.package }}
          bun run test
