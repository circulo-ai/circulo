name: Release - Publish npm Packages

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".changeset/**"
      - ".github/workflows/release-publish.yml"
      - "packages/**/package.json"
      - "bun.lock"

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish public packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify npm trusted publishing support
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm_version="$(npm --version)"
          npm_major="${npm_version%%.*}"
          npm_minor="${npm_version#*.}"
          npm_minor="${npm_minor%%.*}"
          if [ "$npm_major" -lt 11 ] || { [ "$npm_major" -eq 11 ] && [ "$npm_minor" -lt 5 ]; }; then
            echo "npm ${npm_version} is too old for trusted publishing; npm 11.5.1 or newer is required." >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build public packages
        run: |
          set -euo pipefail
          bun --filter @circulo-ai/di typecheck
          bun --filter @circulo-ai/file-parsers typecheck
          bun --filter @circulo-ai/upload typecheck
          bun --filter @circulo-ai/wf typecheck
          bun --filter @circulo-ai/di build
          bun --filter @circulo-ai/file-parsers build
          bun --filter @circulo-ai/upload build
          bun --filter @circulo-ai/wf build
          bun --filter @circulo-ai/wf-cli typecheck
          bun --filter @circulo-ai/wf-cli build

      - name: Verify CLI package artifact
        run: |
          set -euo pipefail
          test -x packages/wf-cli/dist/cli.mjs
          node packages/wf-cli/dist/cli.mjs --help
          cd packages/wf-cli
          npm pack --dry-run --json > "$RUNNER_TEMP/wf-cli-pack.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const packages = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/wf-cli-pack.json", "utf8"));
            const files = new Set(packages[0].files.map((file) => file.path));
            for (const required of ["package.json", "README.md", "dist/cli.mjs", "dist/index.mjs", "dist/index.d.mts"]) {
              if (!files.has(required)) throw new Error(`Missing ${required} from wf-cli package artifact`);
            }
          '

      - name: Test public packages
        run: |
          set -euo pipefail
          bun --filter @circulo-ai/di test
          bun --filter @circulo-ai/upload test
          bun --filter @circulo-ai/wf test
          bun --filter @circulo-ai/wf-cli test

      - name: Publish changed packages with npm trusted publishing
        uses: changesets/action@v1
        with:
          # Run Changesets through the npm CLI installed above so npm's OIDC
          # trusted-publisher flow is the publisher of record.
          publish: npx --no-install changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
