name: Release - Publish npm Packages

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "packages/*/package.json"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish public packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install npm with trusted publishing support
        run: npm install --global npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build public packages
        run: |
          set -euo pipefail
          bun --filter @circulo-ai/di typecheck
          bun --filter @circulo-ai/file-parsers typecheck
          bun --filter @circulo-ai/upload typecheck
          bun --filter @circulo-ai/wf typecheck
          bun --filter @circulo-ai/di build
          bun --filter @circulo-ai/file-parsers build
          bun --filter @circulo-ai/upload build
          bun --filter @circulo-ai/wf build

      - name: Test public packages
        run: |
          set -euo pipefail
          bun --filter @circulo-ai/di test
          bun --filter @circulo-ai/upload test
          bun --filter @circulo-ai/wf test

      - name: Publish changed packages with npm trusted publishing
        uses: changesets/action@v1
        with:
          publish: bunx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
