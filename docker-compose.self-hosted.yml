services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-circulo}
    volumes:
      - circulo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-circulo}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - circulo-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-circulo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-circulo-local-secret}
    volumes:
      - circulo-minio:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mc --config-dir /tmp/mc alias set local http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && mc --config-dir /tmp/mc ready local',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-circulo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-circulo-local-secret}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc --config-dir /tmp/mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        for bucket in files knowledge chat profile; do
        mc --config-dir /tmp/mc mb --ignore-existing "local/$$bucket" &&
        printf '%s' "<CORSConfiguration><CORSRule><AllowedOrigin>$$NEXT_PUBLIC_APP_URL</AllowedOrigin><AllowedMethod>GET</AllowedMethod><AllowedMethod>HEAD</AllowedMethod><AllowedMethod>PUT</AllowedMethod><AllowedHeader>*</AllowedHeader><ExposeHeader>ETag</ExposeHeader><MaxAgeSeconds>3600</MaxAgeSeconds></CORSRule></CORSConfiguration>" |
        mc --config-dir /tmp/mc cors set "local/$$bucket" -;
        done

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: production
      CIRCULO_DEPLOYMENT_MODE: server
      CIRCULO_RUNTIME_KIND: self-hosted
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-circulo}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3002}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET in .env}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      REDIS_URL: redis://redis:6379
      CIRCULO_STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-circulo}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-circulo-local-secret}
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET_NAME: files
      S3_KB_BUCKET_NAME: knowledge
      S3_CHAT_BUCKET_NAME: chat
      S3_PROFILE_PICTURES_BUCKET_NAME: profile
      BILLING_ENABLED: "false"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3002:3002"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3002}
        NEXT_PUBLIC_CIRCULO_RUNTIME_KIND: self-hosted
        NEXT_PUBLIC_STORAGE_ORIGINS: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
        SERVER_API_URL: http://server:3002
    depends_on:
      - server
    ports:
      - "3000:3000"

volumes:
  circulo-postgres:
  circulo-redis:
  circulo-minio:
