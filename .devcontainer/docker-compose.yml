services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    user: "1000:1000"
    volumes:
      - ..:/workspace:cached
      - /workspace/web/node_modules
      - /workspace/web/.next
      - pnpm-store:/home/node/.local/share/pnpm/store
      - git-credential-cache:/home/node/.git-credential-cache
    command: sleep infinity
    working_dir: /workspace/web
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/app
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - GIT_CREDENTIAL_HELPER=cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devnet

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Mount init scripts - they run on first container creation
      - ../docker/initdb:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # Disable locale warnings
      LC_ALL: C
      LANG: C
    healthcheck:
      # Simplified health check - just verify postgres is accepting connections
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - devnet

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - devnet

volumes:
  postgres-data:
  redis-data:
  pnpm-store:
  git-credential-cache:

networks:
  devnet:
    driver: bridge
