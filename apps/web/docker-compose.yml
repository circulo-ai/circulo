services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: circulo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: circulo-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    container_name: circulo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: circulo-minio
      MINIO_ROOT_PASSWORD: circulo-minio-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mc --config-dir /tmp/mc alias set local http://127.0.0.1:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1 && mc --config-dir /tmp/mc ready local",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    container_name: circulo-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: circulo-minio
      MINIO_ROOT_PASSWORD: circulo-minio-local-secret
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc --config-dir /tmp/mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        for bucket in files knowledge chat profile; do
          mc --config-dir /tmp/mc mb --ignore-existing "local/$$bucket";
        done
    restart: "no"

volumes:
  pgdata:
  redisdata:
  miniodata:
